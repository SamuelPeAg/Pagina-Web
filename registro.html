<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexoPC - Registro</title>
  <link rel="stylesheet" href="../index.css">
</head>
<body>

  <header class="encabezado">
    <nav class="navegacion">
      <div class="menu-izquierdo">
        <div class="logo">
          <a href="../index.html">
            <img src="../imagenes/logo.png" alt="Inicio NexoPC">
          </a>
        </div>
      </div>
    </nav>
  </header>


  <main class="contenedor-login">
    <form class="formulario-login">
      <h2>Crear Cuenta</h2>
      <input type="text" placeholder="Nombre completo" required>
      <input type="email" placeholder="Correo electrónico" required>
      <input type="password" placeholder="Contraseña" required>
      <input type="password" placeholder="Confirmar contraseña" required>
      <button class="boton boton-claro" type="submit">Registrarse</button>
      <div class="pie-login">
        ¿Ya tienes cuenta? <a href="./login.html">Inicia sesión</a>
      </div>
    </form>
  </main>


  <footer class="pie">
    <div class="seccion-pie" style="justify-content: center;">
      <p>© 2025 NexoPC - Todos los derechos reservados</p>
    </div>
  </footer>
</body>
</html>
