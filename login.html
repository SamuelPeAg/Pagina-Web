<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexoPC - Iniciar Sesión</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>

  <header class="encabezado">
    <nav class="navegacion">
      <div class="menu-izquierdo">
        <div class="logo">
          <a href="./index.html">
            <img src="./imagenes/logo.png" alt="Inicio NexoPC">
          </a>
        </div>
      </div>
    </nav>
  </header>
  
  <main class="contenedor-login">
    <form class="formulario-login">
      <h2>Iniciar Sesión</h2>
      <input type="email" placeholder="Correo electrónico" required>
      <input type="password" placeholder="Contraseña" required>
      <button class="boton boton-claro" type="submit">Entrar</button>
      <div class="pie-login">
        ¿No tienes cuenta? <a href="./registro.html">Regístrate</a>
      </div>
    </form>
  </main>

  <footer class="pie">
    <div class="seccion-pie" style="justify-content: center;">
      <p>© 2025 NexoPC - Todos los derechos reservados</p>
    </div>
  </footer>
</body>
</html>
